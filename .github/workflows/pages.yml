name: Test and deploy GitHub Pages

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Test puzzle rules
        run: npm test
      - name: Check release revision against pull request base
        if: ${{ github.event_name == 'pull_request' }}
        run: node scripts/check-release-version.mjs "${{ github.event.pull_request.base.sha }}"
      - name: Check release revision against pushed base
        if: ${{ github.event_name == 'push' }}
        run: node scripts/check-release-version.mjs "${{ github.event.before }}"

  deploy:
    name: Deploy Pages
    if: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}
    needs: test
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
