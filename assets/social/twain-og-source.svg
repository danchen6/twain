<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <pattern
      id="puzzle-motif"
      width="132"
      height="132"
      patternUnits="userSpaceOnUse"
    >
      <circle
        cx="22"
        cy="22"
        r="3.25"
        fill="none"
        stroke="#8E877F"
        stroke-width="1.5"
        opacity="0.18"
      />
      <rect
        x="94"
        y="83"
        width="7"
        height="7"
        rx="1"
        fill="none"
        stroke="#8E877F"
        stroke-width="1.5"
        opacity="0.14"
      />
      <path
        d="M24 95H46M35 84V106"
        fill="none"
        stroke="#8E877F"
        stroke-linecap="round"
        stroke-width="1.5"
        opacity="0.11"
      />
      <circle cx="111" cy="30" r="1.75" fill="#8E877F" opacity="0.14" />
    </pattern>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow
        dx="0"
        dy="18"
        flood-color="#191919"
        flood-opacity="0.16"
        stdDeviation="22"
      />
    </filter>
  </defs>

  <image
    href="twain-og-paper-v2.png"
    width="1200"
    height="630"
    preserveAspectRatio="none"
  />
  <rect width="1200" height="630" fill="#F7F5F2" opacity="0.08" />
  <rect width="1200" height="630" fill="url(#puzzle-motif)" />
  <rect width="665" height="630" fill="#F7F5F2" opacity="0.86" />

  <g aria-label="Twain">
    <rect x="72" y="58" width="76" height="76" rx="19" fill="#191919" />
    <path
      d="M89 81H131"
      fill="none"
      stroke="#20B7D4"
      stroke-linecap="round"
      stroke-width="11"
    />
    <path
      d="M110 97V120"
      fill="none"
      stroke="#F97714"
      stroke-linecap="round"
      stroke-width="11"
    />
    <text
      x="170"
      y="113"
      fill="#191919"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
      font-size="48"
      font-weight="760"
    >Twain</text>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="72" y="246" fill="#191919" font-size="52" font-weight="800">
      <tspan x="72" dy="0">Two paths.</tspan>
      <tspan x="72" dy="76">Every cell.</tspan>
      <tspan x="72" dy="76">Can you solve the grid?</tspan>
    </text>

    <text x="76" y="500" fill="#605D59" font-size="25" font-weight="520">
      3–5 fresh challenges every day.
    </text>
  </g>

  <g filter="url(#card-shadow)">
    <rect x="698" y="42" width="442" height="546" rx="34" fill="#FFFFFF" />
    <image
      href="twain-board-preview.png"
      x="732"
      y="76"
      width="374"
      height="374"
      preserveAspectRatio="xMidYMid slice"
    />

    <circle cx="764" cy="501" r="19" fill="#211910" />
    <text
      x="764"
      y="509"
      fill="#FFFFFF"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
      font-size="21"
      font-weight="700"
      text-anchor="middle"
    >1</text>
    <rect x="746" y="531" width="36" height="36" fill="#9E9A96" />
    <text
      x="764"
      y="556"
      fill="#FFFFFF"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
      font-size="20"
      font-weight="700"
      text-anchor="middle"
    >A</text>

    <text
      x="806"
      y="504"
      fill="#191919"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
      font-size="27"
      font-weight="760"
    >Guide both lines</text>
    <text
      x="806"
      y="543"
      fill="#605D59"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
      font-size="19"
      font-weight="520"
    >Fill the board without crossing.</text>
  </g>
</svg>
